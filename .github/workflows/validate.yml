name: Validate Grillon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check game.js
      - name: Validate project structure
        run: node scripts/validate.mjs
      - name: Smoke-test game runtime
        run: node scripts/runtime-smoke.mjs
      - name: Prepare local browser test server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/grillon-http.log 2>&1 &
          echo $! > /tmp/grillon-http.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/index.html > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/grillon-http.log
          exit 1
      - name: Smoke-test real Chromium browser
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME" ]; then
            echo "Chromium/Google Chrome não está disponível no runner."
            exit 1
          fi
          timeout 60s "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-timer-throttling --disable-renderer-backgrounding --no-first-run --no-default-browser-check --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8765/scripts/browser-smoke.html > /tmp/grillon-browser-smoke.html
          grep -q "GRILLON_BROWSER_SMOKE_OK" /tmp/grillon-browser-smoke.html
          cat /tmp/grillon-browser-smoke.html | grep "GRILLON_BROWSER_SMOKE_OK"
